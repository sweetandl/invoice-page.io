<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>发票信息</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
        }
        body {
            background-color: #ffffff;
            color: #000000;
            min-height: 100vh;
            padding: 40px 24px;
        }
        .container {
            max-width: 500px;
            margin: 0 auto;
        }
        .title {
            font-size: 36px;
            font-weight: 600;
            text-align: center;
            margin-bottom: 32px;
        }
        .tip-text {
            font-size: 22px;
            color: #333333;
            text-align: center;
            line-height: 1.6;
            margin-bottom: 60px;
        }
        .info-item {
            display: flex;
            margin-bottom: 36px;
            font-size: 24px;
        }
        .label {
            width: 140px;
            color: #888888;
            flex-shrink: 0;
        }
        .value {
            flex: 1;
            word-break: break-all;
        }
        .bottom-tip {
            position: fixed;
            left: 24px;
            right: 24px;
            bottom: 40px;
            font-size: 20px;
            color: #999999;
            text-align: center;
            line-height: 1.6;
        }
    </style>
</head>
<body>
    <div class="container">
        <h1 class="title">发票信息</h1>
        <p class="tip-text">以下信息仅为发票二维码所含信息，并不代表查验发票真伪的结果。</p>

        <div class="info-item">
            <div class="label">发票号码</div>
            <div class="value">26112000003036897226</div>
        </div>
        <div class="info-item">
            <div class="label">合计金额</div>
            <div class="value">¥1950.00(含税)</div>
        </div>
        <div class="info-item">
            <div class="label">开票日期</div>
            <div class="value">2026.07.22</div>
        </div>
    </div>

    <div class="bottom-tip">
        如需查验发票真伪，请通过税务机关提供的官方渠道进行查验。
    </div>
</body>
</html>
